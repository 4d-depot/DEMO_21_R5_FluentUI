<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 96" width="24" height="96">
  <defs>
    <style>
      .normal { stroke: #5c6f82; }
      .hover { stroke: #3d4f62; }
      .pressed { stroke: #2e3f52; }
      .disabled { stroke: #b0b0b0; }
      @media (prefers-color-scheme: dark) {
        .normal { stroke: #c9d6e2; }
        .hover { stroke: #e0eaf5; }
        .pressed { stroke: #9fc0e0; }
        .disabled { stroke: #707070; }
      }
    </style>
  </defs>
  <!-- Normal state (0-24) -->
  <g>
    <path class="normal" d="M6 6l12 12M18 6L6 18" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
  <!-- Hover state (24-48) -->
  <g transform="translate(0, 24)">
    <path class="hover" d="M6 6l12 12M18 6L6 18" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
  <!-- Pressed state (48-72) -->
  <g transform="translate(0, 48)">
    <path class="pressed" d="M6 6l12 12M18 6L6 18" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
  <!-- Disabled state (72-96) -->
  <g transform="translate(0, 72)">
    <path class="disabled" d="M6 6l12 12M18 6L6 18" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.5"/>
  </g>
</svg>
