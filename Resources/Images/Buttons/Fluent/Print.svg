<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 96" width="24" height="96">
  <defs>
    <style>
      .normal { stroke: #1f5f9d; }
      .hover { stroke: #0d47a1; }
      .pressed { stroke: #0a3d7d; }
      .disabled { stroke: #b0b0b0; }
      @media (prefers-color-scheme: dark) {
        .normal { stroke: #9cc6f0; }
        .hover { stroke: #c5e1ff; }
        .pressed { stroke: #6badff; }
        .disabled { stroke: #707070; }
      }
    </style>
  </defs>
  <!-- Normal state (0-24) -->
  <g>
    <rect class="normal" x="7" y="4" width="10" height="5" rx="1.2" stroke-width="1.7" fill="none"/>
    <rect class="normal" x="6" y="13" width="12" height="7" rx="1.2" stroke-width="1.7" fill="none"/>
    <rect class="normal" x="4" y="9" width="16" height="6" rx="1.2" stroke-width="1.7" fill="none"/>
  </g>
  <!-- Hover state (24-48) -->
  <g transform="translate(0, 24)">
    <rect class="hover" x="7" y="4" width="10" height="5" rx="1.2" stroke-width="1.9" fill="none"/>
    <rect class="hover" x="6" y="13" width="12" height="7" rx="1.2" stroke-width="1.9" fill="none"/>
    <rect class="hover" x="4" y="9" width="16" height="6" rx="1.2" stroke-width="1.9" fill="none"/>
  </g>
  <!-- Pressed state (48-72) -->
  <g transform="translate(0, 48)">
    <rect class="pressed" x="7" y="4" width="10" height="5" rx="1.2" stroke-width="1.7" fill="none"/>
    <rect class="pressed" x="6" y="13" width="12" height="7" rx="1.2" stroke-width="1.7" fill="none"/>
    <rect class="pressed" x="4" y="9" width="16" height="6" rx="1.2" stroke-width="1.7" fill="none"/>
  </g>
  <!-- Disabled state (72-96) -->
  <g transform="translate(0, 72)">
    <rect class="disabled" x="7" y="4" width="10" height="5" rx="1.2" stroke-width="1.7" fill="none" opacity="0.5"/>
    <rect class="disabled" x="6" y="13" width="12" height="7" rx="1.2" stroke-width="1.7" fill="none" opacity="0.5"/>
    <rect class="disabled" x="4" y="9" width="16" height="6" rx="1.2" stroke-width="1.7" fill="none" opacity="0.5"/>
  </g>
</svg>
