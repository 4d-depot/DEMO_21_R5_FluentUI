<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 96" width="24" height="96">
  <defs>
    <style>
      .normal { stroke: #5c6f82; }
      .hover { stroke: #0d47a1; }
      .pressed { stroke: #0a3d7d; }
      .disabled { stroke: #b0b0b0; }
      @media (prefers-color-scheme: dark) {
        .normal { stroke: #c9d6e2; }
        .hover { stroke: #c5e1ff; }
        .pressed { stroke: #6badff; }
        .disabled { stroke: #707070; }
      }
    </style>
  </defs>
  <!-- Normal state (0-24) -->
  <g>
    <circle class="normal" cx="11" cy="11" r="5" fill="none" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    <path class="normal" d="M14.5 14.5L18 18" stroke-width="1.4" stroke-linecap="round" fill="none"/>
  </g>
  <!-- Hover state (24-48) -->
  <g transform="translate(0, 24)">
    <circle class="hover" cx="11" cy="11" r="5" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    <path class="hover" d="M14.5 14.5L18 18" stroke-width="1.6" stroke-linecap="round" fill="none"/>
  </g>
  <!-- Pressed state (48-72) -->
  <g transform="translate(0, 48)">
    <circle class="pressed" cx="11" cy="11" r="5" fill="none" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    <path class="pressed" d="M14.5 14.5L18 18" stroke-width="1.4" stroke-linecap="round" fill="none"/>
  </g>
  <!-- Disabled state (72-96) -->
  <g transform="translate(0, 72)">
    <circle class="disabled" cx="11" cy="11" r="5" fill="none" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/>
    <path class="disabled" d="M14.5 14.5L18 18" stroke-width="1.4" stroke-linecap="round" fill="none" opacity="0.5"/>
  </g>
</svg>
